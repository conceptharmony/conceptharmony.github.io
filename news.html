<style>
:root {
  --bg:#f0eeea;
  --glass:rgba(255,255,255,0.55);
  --glass-hov:rgba(255,255,255,0.80);
  --glass-border:rgba(255,255,255,0.85);
  --glass-shadow:rgba(0,0,0,0.08);
  --glass-inset:rgba(255,255,255,0.92);
  --nav-bg:rgba(242,240,236,0.75);
  --text:#1c1c1e;
  --text-soft:#6b6b6e;
  --divider:rgba(0,0,0,0.07);
  --badge:rgba(0,0,0,0.07);
  --dropdown-bg:rgba(248,246,242,0.98);
  --progress:#1c1c1e;
  --sun:#f59e0b;
}
[data-theme="dark"] {
  --bg:#111113;
  --glass:rgba(26,26,30,0.75);
  --glass-hov:rgba(34,34,40,0.90);
  --glass-border:rgba(255,255,255,0.09);
  --glass-shadow:rgba(0,0,0,0.4);
  --glass-inset:rgba(255,255,255,0.04);
  --nav-bg:rgba(16,16,20,0.85);
  --text:#f2f2f7;
  --text-soft:#aeaeb2;
  --divider:rgba(255,255,255,0.07);
  --badge:rgba(255,255,255,0.1);
  --dropdown-bg:rgba(22,22,28,0.98);
  --progress:#f2f2f7;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;}
html{scroll-behavior:smooth;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background 0.4s,color 0.4s;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 65% 50% at 10% 0%,rgba(210,205,195,0.6) 0%,transparent 60%),radial-gradient(ellipse 55% 45% at 90% 100%,rgba(200,198,192,0.4) 0%,transparent 60%);transition:opacity 0.4s;}
[data-theme="dark"] body::before{background:radial-gradient(ellipse 65% 50% at 10% 0%,rgba(25,25,32,0.18) 0%,transparent 60%),radial-gradient(ellipse 55% 45% at 90% 100%,rgba(22,22,30,0.12) 0%,transparent 60%);}
.blob{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.blob-1{width:500px;height:500px;background:rgba(200,195,185,0.3);top:-100px;left:-100px;animation:b1 14s ease-in-out infinite;}
.blob-2{width:380px;height:380px;background:rgba(195,192,183,0.22);bottom:-80px;right:-80px;animation:b2 17s ease-in-out infinite;}
[data-theme="dark"] .blob-1{background:rgba(30,30,40,0.08);}
[data-theme="dark"] .blob-2{background:rgba(26,26,36,0.06);}
@keyframes b1{0%,100%{transform:translate(0,0)}50%{transform:translate(45px,35px)}}
@keyframes b2{0%,100%{transform:translate(0,0)}50%{transform:translate(-35px,-30px)}}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.2);border-radius:3px;}

#progressBar{position:fixed;top:0;left:0;height:3px;background:var(--progress);width:0%;z-index:2500;transition:width 0.1s;opacity:0.5;}

nav{position:sticky;top:0;z-index:200;height:60px;display:flex;align-items:center;padding:0 clamp(14px,3vw,36px);gap:4px;background:var(--nav-bg);backdrop-filter:blur(32px) saturate(1.5);-webkit-backdrop-filter:blur(32px) saturate(1.5);border-bottom:1px solid var(--divider);box-shadow:0 1px 16px var(--glass-shadow);transition:background 0.4s;}
.logo{font-size:clamp(15px,2vw,19px);font-weight:300;letter-spacing:-0.3px;color:var(--text);margin-right:14px;white-space:nowrap;flex-shrink:0;text-decoration:none;transition:color 0.4s;}
.logo b{font-weight:700;}
.nav-links{display:flex;gap:3px;align-items:center;flex:1;overflow:hidden;}
.nav-btn{padding:6px 13px;border-radius:16px;border:1px solid transparent;background:transparent;font-family:'Outfit',sans-serif;font-size:13.5px;font-weight:500;color:var(--text-soft);cursor:pointer;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:6px;transition:all 0.18s cubic-bezier(.34,1.4,.64,1);flex-shrink:0;}
.nav-btn:hover,.nav-btn.active{background:var(--glass-hov);border-color:var(--glass-border);color:var(--text);box-shadow:0 2px 10px var(--glass-shadow);transform:scale(1.04);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0;}

.dropdown-wrap{position:relative;}
.dropdown{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--dropdown-bg);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden;min-width:190px;box-shadow:0 12px 40px rgba(0,0,0,0.18);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:300;}
.dropdown.open{display:block;animation:dropIn 0.18s ease;}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.dropdown a{display:flex;align-items:center;gap:10px;padding:12px 16px;text-decoration:none;color:var(--text-soft);font-size:13.5px;border-bottom:1px solid var(--divider);transition:all 0.15s;}
.dropdown a:last-child{border-bottom:none;}
.dropdown a:hover{background:var(--glass);color:var(--text);}
.dropdown svg{width:17px;height:17px;fill:currentColor;flex-shrink:0;}

.hamburger{display:none;width:36px;height:36px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass);cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0;transition:all 0.18s cubic-bezier(.34,1.4,.64,1);}
.hamburger:hover{transform:scale(1.04);}
.hamburger span{display:block;width:15px;height:1.5px;background:var(--text);border-radius:2px;transition:all 0.3s;}
.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
.mobile-nav{display:none;position:fixed;top:60px;left:0;right:0;z-index:190;flex-direction:column;gap:4px;padding:12px;background:var(--nav-bg);border-bottom:1px solid var(--divider);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);}
.mobile-nav.open{display:flex;}
.mobile-nav .nav-btn{width:100%;justify-content:flex-start;padding:10px 14px;font-size:14.5px;}
.mobile-nav .dropdown{position:static;box-shadow:none;border:none;background:transparent;padding-left:16px;margin-top:2px;border-radius:0;}
.mobile-nav .dropdown.open{display:block;}
.mobile-nav .dropdown a{border-radius:10px;}

.theme-toggle{width:38px;height:38px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 10px var(--glass-shadow);transition:background 0.3s;overflow:hidden;position:relative;}
.theme-toggle:hover{background:var(--glass-hov);}
.theme-toggle::after{content:'';position:absolute;width:0;height:0;border-radius:50%;background:rgba(245,158,11,0.2);top:50%;left:50%;transform:translate(-50%,-50%);}
.theme-toggle.rippling::after{animation:ripple 0.5s ease-out forwards;}
@keyframes ripple{to{width:90px;height:90px;opacity:0}}
.icon-wrap{position:relative;width:20px;height:20px;}
.icon-wrap.spin{animation:iconSpin 0.55s cubic-bezier(.34,1.4,.64,1) forwards;}
@keyframes iconSpin{0%{transform:rotate(0) scale(1)}45%{transform:rotate(195deg) scale(0.5)}100%{transform:rotate(360deg) scale(1)}}
.icon-sun,.icon-moon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity 0.3s,transform 0.45s cubic-bezier(.34,1.4,.64,1);}
.sun-core{width:9px;height:9px;border-radius:50%;background:var(--sun);box-shadow:0 0 6px 2px rgba(245,158,11,0.45);position:relative;z-index:2;}
.sun-rays{position:absolute;inset:0;}
.sun-rays::before{content:'';position:absolute;top:50%;left:50%;width:2px;height:2px;margin:-1px;border-radius:50%;background:var(--sun);box-shadow:0 -9px 0 1px var(--sun),0 9px 0 1px var(--sun),-9px 0 0 1px var(--sun),9px 0 0 1px var(--sun),-6px -6px 0 1px var(--sun),6px -6px 0 1px var(--sun),-6px 6px 0 1px var(--sun),6px 6px 0 1px var(--sun);}
.moon-shape{width:12px;height:12px;border-radius:50%;background:transparent;box-shadow:3px -2px 0 0 #c8c8ce;}
[data-theme="light"] .icon-sun{opacity:1;transform:scale(1) rotate(0);}
[data-theme="light"] .icon-moon{opacity:0;transform:scale(0.4) rotate(-80deg);}
[data-theme="dark"] .icon-sun{opacity:0;transform:scale(0.4) rotate(80deg);}
[data-theme="dark"] .icon-moon{opacity:1;transform:scale(1) rotate(0);}

main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:clamp(20px,3vw,36px) clamp(14px,3vw,28px) 80px;}

.controls{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
.search-input{flex:2;min-width:160px;padding:11px 14px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);outline:none;box-shadow:0 3px 12px var(--glass-shadow);transition:all 0.2s;}
.search-input::placeholder{color:var(--text-soft);}
.search-input:focus{background:var(--glass-hov);border-color:rgba(100,100,110,0.3);}

.csel{position:relative;flex:1;min-width:130px;}
.csel-btn{width:100%;padding:11px 12px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);outline:none;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;box-shadow:0 3px 12px var(--glass-shadow);transition:all 0.18s cubic-bezier(.34,1.4,.64,1);}
.csel-btn:hover,.csel.open .csel-btn{border-color:rgba(100,100,110,0.35);background:var(--glass-hov);transform:scale(1.02);}
.csel-chev{flex-shrink:0;color:var(--text-soft);transition:transform 0.2s;}
.csel.open .csel-chev{transform:rotate(180deg);}
.csel-menu{display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:400;background:var(--dropdown-bg);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden;box-shadow:0 10px 32px rgba(0,0,0,0.14);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);}
.csel.open .csel-menu{display:block;animation:dropIn 0.16s ease;}
.csel-opt{padding:10px 13px;font-size:13.5px;color:var(--text-soft);cursor:pointer;border-bottom:1px solid var(--divider);transition:all 0.13s;font-family:'Outfit',sans-serif;}
.csel-opt:last-child{border-bottom:none;}
.csel-opt:hover{background:var(--glass);color:var(--text);}
.csel-opt.selected{color:var(--text);font-weight:600;}

.glass-panel{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--glass-border);box-shadow:0 6px 28px var(--glass-shadow),inset 0 1px 0 var(--glass-inset);border-radius:16px;transition:background 0.4s,border-color 0.4s;}

.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:clamp(12px,2vw,20px);}

.news-card{cursor:pointer;overflow:hidden;display:flex;flex-direction:column;border-radius:16px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);box-shadow:0 6px 22px var(--glass-shadow),inset 0 1px 0 var(--glass-inset);transition:transform 0.3s cubic-bezier(.34,1.4,.64,1),box-shadow 0.3s,background 0.4s;animation:cardIn 0.4s ease both;}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.news-card:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 16px 40px var(--glass-shadow);background:var(--glass-hov);}
.news-card:active{transform:scale(0.98);}
.news-img{width:100%;height:200px;object-fit:cover;display:block;}
.news-body{padding:clamp(14px,2vw,22px);flex:1;display:flex;flex-direction:column;}
.news-meta{font-size:11px;color:var(--text-soft);margin-bottom:8px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:0.08em;}
.news-title{font-size:clamp(15px,2vw,19px);font-weight:700;letter-spacing:-0.3px;margin:0 0 10px;color:var(--text);line-height:1.3;}
.news-summary{font-size:13.5px;color:var(--text-soft);line-height:1.6;flex:1;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.read-more{font-size:13px;font-weight:600;color:var(--text-soft);margin-top:auto;letter-spacing:0.02em;}

.hero-card{grid-column:1/-1;flex-direction:row;height:360px;}
.hero-card .news-img{width:50%;height:100%;flex-shrink:0;}
.hero-card .news-body{width:50%;justify-content:center;padding:clamp(20px,4vw,44px);}
.hero-card .news-title{font-size:clamp(20px,3vw,32px);margin-bottom:14px;}
.hero-card .news-summary{-webkit-line-clamp:4;font-size:14.5px;}
@media(max-width:700px){
  .hero-card{flex-direction:column;height:auto;}
  .hero-card .news-img{width:100%;height:220px;}
  .hero-card .news-body{width:100%;padding:20px;}
}

.hidden{display:none!important;}

#article-view{animation:fadeUp 0.35s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-family:'Outfit',sans-serif;font-size:13.5px;font-weight:500;color:var(--text);cursor:pointer;margin-bottom:22px;box-shadow:0 3px 12px var(--glass-shadow);transition:all 0.18s cubic-bezier(.34,1.4,.64,1);}
.back-btn:hover{transform:translateX(-3px) scale(1.02);background:var(--glass-hov);}

.article-header{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--divider);}
.article-title{font-size:clamp(22px,4vw,40px);font-weight:700;letter-spacing:-0.8px;line-height:1.2;margin:10px 0 16px;}
.article-meta-row{display:flex;justify-content:space-between;align-items:center;color:var(--text-soft);font-size:13px;flex-wrap:wrap;gap:10px;}
.reading-time-badge{background:var(--badge);padding:4px 12px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:5px;}
.share-btn{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 12px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass);transition:all 0.18s cubic-bezier(.34,1.4,.64,1);}
.share-btn:hover{background:var(--glass-hov);transform:scale(1.04);}
.share-btn svg{width:16px;height:16px;fill:currentColor;}
.article-hero{width:100%;height:auto;max-height:480px;object-fit:cover;border-radius:16px;margin-bottom:28px;display:block;}
.article-content{font-size:clamp(15px,2vw,17px);line-height:1.8;color:var(--text);max-width:780px;margin:0 auto;}
.article-content p{margin-bottom:20px;}
.article-content h2,.article-content h3{font-weight:700;letter-spacing:-0.3px;margin:32px 0 12px;color:var(--text);}
.article-content img{width:100%;height:auto;border-radius:10px;margin:20px 0;border:1px solid var(--glass-border);display:block;}

@media(max-width:900px){.nav-links{display:none;}.hamburger{display:flex;}}
@media(max-width:600px){.controls{flex-direction:column;}.csel{min-width:0;width:100%;}}
</style>
</head>

      <a href="https://discord.gg/hNPtTVHurH" target="_blank"><svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>Discord</a>
      <a href="https://www.tiktok.com/@spinach.tech" target="_blank"><svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>TikTok Main</a>
      <a href="https://www.tiktok.com/@spinach.technologies" target="_blank"><svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>TikTok Concept</a>
    </div>
  </div>
</div>

<main>
  <div id="list-view">
    <div class="controls">
      <input class="search-input" id="searchInput" type="text" placeholder="Search news…"/>
      <div class="csel" id="sortSel">
        <button type="button" class="csel-btn" onclick="cselToggle('sortSel',event)"><span id="sortLabel">Newest First</span><svg class="csel-chev" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="csel-menu">
          <div class="csel-opt selected" onclick="cselPick('newest','Newest First')">Newest First</div>
          <div class="csel-opt" onclick="cselPick('oldest','Oldest First')">Oldest First</div>
        </div>
      </div>
    </div>
    <div class="news-grid" id="newsGrid"></div>
  </div>

  <div id="article-view" class="hidden">
    <button class="back-btn" onclick="closeArticle()">← Back to News</button>
    <div class="glass-panel" style="padding:clamp(20px,4vw,40px);">
      <div class="article-header">
        <h1 class="article-title" id="a_title">Article Title</h1>
        <div class="article-meta-row">
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
            <span id="a_author" style="font-weight:500;color:var(--text)"></span>
            <span style="color:var(--text-soft)">•</span>
            <span id="a_date"></span>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <span id="a_time" class="reading-time-badge"></span>
            <div class="share-btn" onclick="shareArticle()">
              <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.66 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
              Share
            </div>
          </div>
        </div>
      </div>
      <img id="a_img" src="" class="article-hero"/>
      <div id="a_content" class="article-content"></div>
    </div>
  </div>
</main>

<script>
let allNews = [], sortVal = 'newest';

function cselToggle(id, e) {
  e.stopPropagation();
  const isOpen = document.getElementById(id).classList.contains('open');
  document.querySelectorAll('.csel.open').forEach(el=>el.classList.remove('open'));
  if(!isOpen) document.getElementById(id).classList.add('open');
}
function cselPick(val, label) {
  sortVal = val;
  document.getElementById('sortLabel').textContent = label;
  document.getElementById('sortSel').querySelector('.csel-menu').querySelectorAll('.csel-opt').forEach(o=>o.classList.toggle('selected', o.textContent.trim()===label));
  document.getElementById('sortSel').classList.remove('open');
  renderNews();
}

function fmtDate(str) {
  if(!str) return '';
  const d = new Date(str+'T00:00:00');
  if(isNaN(d)) return str;
  return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
}

async function init() {
  try {
    const res = await fetch('news.json');
    if(!res.ok) throw new Error();
    allNews = await res.json();
    if(!allNews.length) throw new Error();
  } catch(e) {
    allNews = [{
      title:'Welcome to ConceptHarmony News',
      summary:'Stay up to date with the latest concept devices, chipsets, sensors and announcements from the ConceptHarmony community.',
      author:'ConceptHarmony',
      date:'2025-01-01',
      image:'',
      content:'<p>No news.json file was found. Add a news.json file to start publishing articles.</p>'
    }];
  }
  renderNews();
}

function renderNews() {
  const term = document.getElementById('searchInput').value.toLowerCase();
  let list = allNews.filter(n => n.title.toLowerCase().includes(term) || (n.summary||'').toLowerCase().includes(term));
  list.sort((a,b) => {
    const da = new Date(a.date).getTime();
    const db = new Date(b.date).getTime();
    return sortVal==='newest' ? db-da : da-db;
  });
  const grid = document.getElementById('newsGrid');
  if(!list.length){grid.innerHTML="<p style='color:var(--text-soft);padding:40px;grid-column:1/-1;text-align:center;'>No articles found.</p>";return;}
  grid.innerHTML = list.map((n,idx) => {
    const isHero = idx===0 && term==='';
    const cls = isHero ? 'news-card hero-card' : 'news-card';
    const imgHtml = n.image ? `<img src="${n.image}" class="news-img" onerror="this.style.display='none'" loading="lazy"/>` : '';
    return `<div class="${cls}" onclick="openArticle('${n.title.replace(/'/g,"\\'")}')">
      ${imgHtml}
      <div class="news-body">
        <div class="news-meta"><span>${fmtDate(n.date)}</span><span>${n.author||''}</span></div>
        <h2 class="news-title">${n.title}</h2>
        <div class="news-summary">${n.summary||''}</div>
        <div class="read-more">Read Article →</div>
      </div>
    </div>`;
  }).join('');
}

function openArticle(title) {
  const article = allNews.find(n=>n.title===title);
  if(!article) return;
  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('article-view').classList.remove('hidden');
  window.scrollTo(0,0);
  document.getElementById('a_title').textContent = article.title;
  document.getElementById('a_date').textContent = fmtDate(article.date);
  document.getElementById('a_author').textContent = 'By '+(article.author||'');
  const img = document.getElementById('a_img');
  if(article.image){img.src=article.image;img.style.display='block';}else{img.style.display='none';}
  document.getElementById('a_content').innerHTML = article.content||'';
  const words = (article.content||'').replace(/<[^>]*>/g,'').split(/\s+/).length;
  document.getElementById('a_time').textContent = `⏱ ${Math.max(1,Math.ceil(words/200))} min read`;
}

function closeArticle() {
  document.getElementById('article-view').classList.add('hidden');
  document.getElementById('list-view').classList.remove('hidden');
  window.scrollTo(0,0);
}

function shareArticle() {
  navigator.clipboard.writeText(window.location.href);
  alert('Link copied: '+document.getElementById('a_title').textContent);
}

window.onscroll = () => {
  const scrolled = (document.body.scrollTop||document.documentElement.scrollTop) / (document.documentElement.scrollHeight-document.documentElement.clientHeight) * 100;
  document.getElementById('progressBar').style.width = scrolled+'%';
};

document.getElementById('themeBtn').addEventListener('click',()=>{
  const html=document.documentElement;
  const isDark=html.dataset.theme==='dark';
  const btn=document.getElementById('themeBtn');
  const wrap=document.getElementById('iconWrap');
  btn.classList.remove('rippling');void btn.offsetWidth;btn.classList.add('rippling');
  wrap.classList.remove('spin');void wrap.offsetWidth;wrap.classList.add('spin');
  setTimeout(()=>{html.dataset.theme=isDark?'light':'dark';localStorage.setItem('ch-theme',html.dataset.theme);},230);
  setTimeout(()=>{wrap.classList.remove('spin');btn.classList.remove('rippling');},650);
});
document.getElementById('socialsBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('socialsDropdown').classList.toggle('open');});
document.getElementById('mobileSocialsBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('mobileSocialsDropdown').classList.toggle('open');});
document.getElementById('hamburger').addEventListener('click',()=>{document.getElementById('hamburger').classList.toggle('open');document.getElementById('mobileNav').classList.toggle('open');});
document.addEventListener('click',e=>{
  if(!e.target.closest('.dropdown-wrap')){document.getElementById('socialsDropdown').classList.remove('open');document.getElementById('mobileSocialsDropdown').classList.remove('open');}
  if(!e.target.closest('.csel')) document.querySelectorAll('.csel.open').forEach(el=>el.classList.remove('open'));
});
document.getElementById('searchInput').addEventListener('input',renderNews);

init();
</script>
</body>
</html>
