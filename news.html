<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>News - ConceptHarmony</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script>
(function(){
  const t=localStorage.getItem('ch-theme');
  if(t) document.documentElement.dataset.theme=t;
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg:  #e8e8e8;
  --g:   rgba(255,255,255,0.52);
  --gh:  rgba(255,255,255,0.86);
  --gs:  rgba(0,0,0,0.05);
  --gi:  rgba(255,255,255,0.90);
  --nav: rgba(234,232,228,0.25);
  --tx:  #111113; --ts: #6b6b72;
  --dv:  rgba(0,0,0,0.08); --bd: rgba(0,0,0,0.06);
  --rh:  rgba(255,255,255,0.45);
  --dd:  rgba(246,244,241,0.82);
  --sl:  rgba(0,0,0,0.05);
  --dc:  #a1a1aa; --du: #111113; --sun: #f59e0b;
  --pixel-color: rgba(0,0,0,0.28);
}
[data-theme=dark] {
  --bg:  #0e0e11;
  --g:   rgba(30,30,38,0.52);
  --gh:  rgba(42,42,52,0.70);
  --gs:  rgba(0,0,0,0.55);
  --gi:  rgba(255,255,255,0.04);
  --nav: rgba(11,11,15,0.72);
  --tx:  #f0f0f5; --ts: #9898a6;
  --dv:  rgba(255,255,255,0.07); --bd: rgba(255,255,255,0.08);
  --rh:  rgba(255,255,255,0.04);
  --dd:  rgba(19,19,25,0.97);
  --sl:  rgba(255,255,255,0.07);
  --dc:  #52525b; --du: #f0f0f5;
  --pixel-color: rgba(255,255,255,0.22);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; font-size:15px; overflow-x:hidden; }
* { user-select:none; -webkit-user-select:none; }
input, textarea, select { user-select:text; -webkit-user-select:text; }

body {
  font-family:'Inter',sans-serif;
  background:var(--bg); color:var(--tx);
  min-height:100vh; 
  transition:background .4s,color .4s;
  padding-top:60px;
}
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 0% 0%,   rgba(220,218,230,0.90) 0%, transparent 60%),
    radial-gradient(ellipse 60% 55% at 100% 100%,rgba(210,215,225,0.80) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 100% 0%,  rgba(225,222,235,0.70) 0%, transparent 55%),
    radial-gradient(ellipse 50% 55% at 0%   100%,rgba(215,218,228,0.65) 0%, transparent 55%);
}
[data-theme=dark] body::before {
  background:
    radial-gradient(ellipse 70% 60% at 0% 0%,   rgba(60,60,80,0.35)  0%, transparent 55%),
    radial-gradient(ellipse 60% 55% at 100% 100%,rgba(40,40,60,0.28)  0%, transparent 55%),
    radial-gradient(ellipse 50% 50% at 100% 0%,  rgba(50,50,70,0.25)  0%, transparent 50%),
    radial-gradient(ellipse 50% 55% at 0%   100%,rgba(35,35,55,0.22)  0%, transparent 50%);
}
.blob { position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0; }
.blob-1 { width:700px; height:700px; top:-200px; left:-200px; background:rgba(200,198,215,0.50); animation:b1 20s ease-in-out infinite; }
.blob-2 { width:500px; height:500px; bottom:-150px; right:-150px; background:rgba(185,183,200,0.40); animation:b2 26s ease-in-out infinite; }
[data-theme=dark] .blob-1 { background:rgba(70,70,100,0.20); }
[data-theme=dark] .blob-2 { background:rgba(40,40,70,0.18); }
@keyframes b1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,50px)} }
@keyframes b2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-45px)} }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }

::-webkit-scrollbar-corner { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(128,128,128,0.22); border-radius:3px; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:60px; display:flex; align-items:center;
  padding:0 clamp(14px,3vw,36px); gap:4px;
  background:var(--nav);
  backdrop-filter:blur(96px) saturate(2); -webkit-backdrop-filter:blur(96px) saturate(2);
  border-bottom:1px solid var(--dv);
  transition:background .4s;
}
.logo { font-size:clamp(15px,2vw,18px); font-weight:300; letter-spacing:-.4px; color:var(--tx); margin-right:16px; white-space:nowrap; flex-shrink:0; text-decoration:none; cursor:pointer; }
.logo b { font-weight:800; }
.nav-links { display:flex; gap:2px; align-items:center; flex:1; overflow:hidden; }
.nav-btn {
  padding:6px 12px; border-radius:8px; border:none; background:transparent;
  font-family:'Inter',sans-serif; font-size:13px; font-weight:500;
  color:var(--ts); cursor:pointer; white-space:nowrap;
  text-decoration:none; display:flex; align-items:center; gap:6px;
  flex-shrink:0; transition:background .18s, color .18s;
}
.nav-btn:hover, .nav-btn.active {
  background:var(--g);
  backdrop-filter:blur(96px) saturate(2); -webkit-backdrop-filter:blur(96px) saturate(2);
  color:var(--tx);
}
.nav-right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0; }

.dropdown-wrap { position:relative; }
.dropdown {
  display:none; position:absolute; right:0; top:calc(100% + 8px);
  background:var(--g);
  backdrop-filter:blur(96px) saturate(2); -webkit-backdrop-filter:blur(96px) saturate(2);
  border:1px solid var(--gi); border-radius:12px; overflow:hidden; min-width:190px;
  box-shadow:none; z-index:300;
}
.dropdown.open { display:block; animation:dropIn .15s ease; }
@keyframes dropIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }
.dropdown a { display:flex; align-items:center; gap:10px; padding:11px 16px; text-decoration:none; color:var(--ts); font-size:13px; border-bottom:1px solid var(--dv); transition:background .12s; cursor:pointer; }
.dropdown a:last-child { border-bottom:none; }
.dropdown a:hover { background:var(--g); color:var(--tx); }
.dropdown svg { width:16px; height:16px; fill:currentColor; flex-shrink:0; }

.hamburger {
  display:none; width:36px; height:36px; border-radius:8px; border:none;
  background:var(--g); backdrop-filter:blur(96px) saturate(2); -webkit-backdrop-filter:blur(96px) saturate(2);
  cursor:pointer; flex-direction:column; align-items:center; justify-content:center;
  gap:5px; flex-shrink:0; transition:background .18s;
}
.hamburger span { display:block; width:14px; height:1.5px; background:var(--tx); border-radius:2px; transition:all .26s; }
.hamburger.open span:nth-child(1) { transform:translateY(6.5px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity:0; }
.hamburger.open span:nth-child(3) { transform:translateY(-6.5px) rotate(-45deg); }

.mobile-nav {
  display:none; position:fixed; top:60px; left:0; right:0; bottom:0; z-index:190;
  flex-direction:column; gap:2px; padding:16px;
  background:rgba(14,14,17,0.12);
  backdrop-filter:blur(120px) saturate(2); -webkit-backdrop-filter:blur(96px) saturate(2);
  border-bottom:1px solid var(--dv);
}
[data-theme=light] .mobile-nav { background:rgba(234,232,228,0.04); }
.mobile-nav.open { display:flex; animation:dropIn .2s ease; }
.mobile-nav .nav-btn { width:100%; justify-content:flex-start; padding:14px 16px; font-size:18px; font-weight:400; border:none; background:transparent; border-radius:10px; color:var(--tx); }
.mobile-nav .nav-btn:hover, .mobile-nav .nav-btn.active { background:rgba(128,128,128,0.12); }
.mobile-nav .dropdown { position:static; box-shadow:none; background:var(--g); padding-left:16px; margin-top:2px; border-radius:0; }
.mobile-nav .dropdown.open { display:block; }
.mobile-nav .dropdown a { border-radius:6px; font-size:13px; }

.theme-toggle {
  width:36px; height:36px; border-radius:8px; border:none; background:var(--g);
  backdrop-filter:blur(96px) saturate(2); -webkit-backdrop-filter:blur(96px) saturate(2);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:background .22s; overflow:hidden; position:relative;
}
.theme-toggle:hover { background:var(--gh); }
.theme-toggle::after { content:''; position:absolute; width:0; height:0; border-radius:50%; background:rgba(245,158,11,0.18); top:50%; left:50%; transform:translate(-50%,-50%); }
.theme-toggle.rippling::after { animation:ripple .5s ease-out forwards; }
@keyframes ripple { to{width:90px;height:90px;opacity:0} }
.icon-wrap { position:relative; width:20px; height:20px; }
.icon-wrap.spin { animation:iconSpin .55s cubic-bezier(.34,1.4,.64,1) forwards; }
@keyframes iconSpin { 0%{transform:rotate(0) scale(1)} 45%{transform:rotate(195deg) scale(.5)} 100%{transform:rotate(360deg) scale(1)} }
.icon-sun,.icon-moon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transition:opacity .3s,transform .45s cubic-bezier(.34,1.4,.64,1); }
.sun-core { width:9px; height:9px; border-radius:50%; background:var(--sun); box-shadow:0 0 6px 2px rgba(245,158,11,.45); position:relative; z-index:2; }
.sun-rays { position:absolute; inset:0; }
.sun-rays::before { content:''; position:absolute; top:50%; left:50%; width:2px; height:2px; margin:-1px; border-radius:50%; background:var(--sun); box-shadow:0 -9px 0 1px var(--sun),0 9px 0 1px var(--sun),-9px 0 0 1px var(--sun),9px 0 0 1px var(--sun),-6px -6px 0 1px var(--sun),6px -6px 0 1px var(--sun),-6px 6px 0 1px var(--sun),6px 6px 0 1px var(--sun); }
.moon-shape { width:12px; height:12px; border-radius:50%; background:transparent; box-shadow:3px -2px 0 0 #c0c0ca; }
[data-theme=light] .icon-sun  { opacity:1; transform:scale(1) rotate(0); }
[data-theme=light] .icon-moon { opacity:0; transform:scale(.4) rotate(-80deg); }
[data-theme=dark]  .icon-sun  { opacity:0; transform:scale(.4) rotate(80deg); }
[data-theme=dark]  .icon-moon { opacity:1; transform:scale(1) rotate(0); }

main { position:relative; max-width:1200px; margin:0 auto; padding:clamp(24px,3vw,40px) clamp(14px,3vw,28px) 80px; }

.controls { display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
.search-input {
  flex:2; min-width:160px; padding:11px 16px; border-radius:10px; border:1px solid var(--gi);
  background:var(--g); backdrop-filter:blur(88px) saturate(2); -webkit-backdrop-filter:blur(88px) saturate(2);
  box-shadow:none; border:1px solid var(--gi);
  font-family:'Inter',sans-serif; font-size:13.5px; color:var(--tx); outline:none; transition:background .2s;
}
.search-input::placeholder { color:var(--ts); }
.search-input:focus { background:var(--gh); }
.csel { position:relative; flex:1; min-width:130px; }
.csel-btn {
  width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--gi);
  background:var(--g); backdrop-filter:blur(88px) saturate(2); -webkit-backdrop-filter:blur(88px) saturate(2);
  box-shadow:none;
  font-family:'Inter',sans-serif; font-size:13.5px; color:var(--tx); outline:none; cursor:pointer;
  text-align:left; 
  transition:background .2s; display:flex; align-items:center; justify-content:space-between; gap:6px;
}
.csel-btn:hover, .csel.open .csel-btn { background:var(--gh); }
.csel-chevron,.csel-chev { flex-shrink:0; transition:transform .2s; }
.csel.open .csel-chevron,.csel.open .csel-chev { transform:rotate(180deg); }
.csel-menu {
  display:none; position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:400;
  background:var(--g);
  backdrop-filter:blur(96px) saturate(2); -webkit-backdrop-filter:blur(96px) saturate(2);
  border:1px solid var(--gi); border-radius:10px; overflow:hidden; box-shadow:none;
}
.csel.open .csel-menu { display:block; animation:dropIn .15s ease; }
.csel-opt { padding:10px 14px; font-size:13px; color:var(--ts); cursor:pointer; border-bottom:1px solid var(--dv); transition:background .12s; font-family:'Inter',sans-serif; }
.csel-opt:last-child { border-bottom:none; }
.csel-opt:hover { background:var(--g); color:var(--tx); }
.csel-opt.selected { color:var(--tx); font-weight:600; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr)); gap:clamp(12px,2vw,18px); }
.card {
  border-radius:18px; overflow:hidden; cursor:pointer;
  background:var(--g);
  backdrop-filter:blur(88px) saturate(2); -webkit-backdrop-filter:blur(88px) saturate(2);
  border:1px solid var(--gi); box-shadow:none;
  transition:transform .22s cubic-bezier(.34,1.4,.64,1), background .2s;
  animation:cardIn .4s ease both;
}
@keyframes cardIn { from{opacity:0;transform:translateY(20px) scale(.96)} to{opacity:1;transform:none} }
.card:hover { transform:translateY(-4px) scale(1.012); background:var(--gh); }
.card:active { opacity:0.88; transform:scale(.98); }
.card-img {
  width:100%; aspect-ratio:4/3;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:linear-gradient(145deg, rgba(255,255,255,0.55) 0%, rgba(190,184,178,0.18) 100%);
}
[data-theme=dark] .card-img { background:linear-gradient(145deg, rgba(255,255,255,0.04) 0%, rgba(20,20,32,0.20) 100%); }
.card-img img { width:100%; height:100%; object-fit:contain; padding:18px; }
.card-body { padding:14px 16px 18px; }
.type-tag { display:inline-block; padding:2px 8px; border-radius:5px; font-size:9.5px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; background:var(--bd); color:var(--ts); margin-bottom:7px; }
.card-name { font-size:14px; font-weight:600; letter-spacing:-.25px; color:var(--tx); margin-bottom:2px; }
.card-brand { font-size:12.5px; color:var(--ts); }

.glass-panel {
  background:var(--g);
  backdrop-filter:blur(96px) saturate(2); -webkit-backdrop-filter:blur(96px) saturate(2);
  border:1px solid var(--gi); box-shadow:none;
  border-radius:20px; padding:clamp(20px,3vw,30px); transition:background .3s;
}
.hidden { display:none !important; }

#detail-view { animation:fadeUp .3s ease both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
.back-btn {
  display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:9px; border:1px solid var(--gi);
  background:var(--g); backdrop-filter:blur(80px) saturate(2); -webkit-backdrop-filter:blur(80px) saturate(2);
  border:1px solid var(--gi); box-shadow:none;
  font-family:'Inter',sans-serif; font-size:13px; font-weight:500; color:var(--tx); cursor:pointer; margin-bottom:20px;
  transition:background .18s, transform .18s;
}
.back-btn:hover { transform:translateX(-3px); background:var(--gh); }
.detail-hero { display:flex; gap:clamp(20px,3vw,36px); flex-wrap:wrap; align-items:flex-start; margin-bottom:18px; }
.detail-img {
  flex:1; min-width:220px; max-width:340px; display:flex; align-items:center; justify-content:center;
  min-height:280px; overflow:hidden; background:var(--g);
  backdrop-filter:blur(88px) saturate(2); -webkit-backdrop-filter:blur(88px) saturate(2);
  border:1px solid var(--gi); border-radius:20px; box-shadow:none;
}
.detail-img img { width:100%; object-fit:contain; padding:28px; }
.detail-info { flex:2; min-width:220px; }
.detail-name { font-size:clamp(24px,4vw,38px); font-weight:700; letter-spacing:-.8px; line-height:1.1; margin:8px 0 4px; }
.detail-brand { font-size:15px; color:var(--ts); margin-bottom:22px; }

.quick-specs { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.qs-item {
  display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:12px;
  background:var(--g); backdrop-filter:blur(80px) saturate(2); -webkit-backdrop-filter:blur(80px) saturate(2);
  border:1px solid var(--gi); box-shadow:none;
}
.qs-icon { width:20px; height:20px; fill:var(--ts); flex-shrink:0; }
.qs-label { font-size:9.5px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:var(--ts); display:block; margin-bottom:2px; }
.qs-val { font-size:13.5px; font-weight:600; color:var(--tx); display:block; line-height:1.2; word-break:break-word; }

.tabs { display:flex; gap:8px; margin:18px 0 14px; flex-wrap:wrap; }
.tab-btn {
  flex:1; min-width:90px; padding:11px; border-radius:12px; text-align:center; border:1px solid var(--gi);
  background:var(--g); backdrop-filter:blur(80px) saturate(2); -webkit-backdrop-filter:blur(80px) saturate(2);
  box-shadow:none; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500;
  color:var(--ts); cursor:pointer; transition:background .18s;
}
.tab-btn.active { background:var(--gh); color:var(--tx); font-weight:600; }
.tab-btn:not(.active):hover { background:var(--gh); }

.spec-list { display:flex; flex-direction:column; }
.spec-group-title { font-size:10px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--ts); padding:16px 18px 6px; border-top:1px solid var(--dv); margin-top:4px; }
.spec-group-title:first-child { border-top:none; margin-top:0; padding-top:12px; }
.spec-row { display:flex; align-items:baseline; gap:12px; padding:9px 18px;  border-radius:6px; }
.spec-row:hover { background:var(--rh); }
.spec-key { width:42%; flex-shrink:0; font-size:13px; color:var(--ts); line-height:1.5; }
.spec-val { flex:1; font-size:13.5px; font-weight:500; color:var(--tx); line-height:1.5; word-break:break-word; }
.spec-secondary-title { font-size:11.5px; font-weight:600; color:var(--ts); padding:11px 18px 3px; text-align:center; border-top:1px solid var(--dv); }
#tab-pics { min-height:200px; }
#tab-pics .pics-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
#tab-pics img { width:100%; border-radius:10px; cursor:pointer; display:block; }

.compare-wrapper { overflow-x:auto; max-height:72vh; overflow-y:auto; position:relative; -webkit-overflow-scrolling:touch; }
.compare-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.compare-header h3 { font-size:16px; font-weight:700; }
.compare-actions { display:flex; gap:8px; }
.diff-btn,.add-slot-btn { padding:7px 14px; font-size:12.5px; border:1px solid var(--dv); cursor:pointer; }
.compare-table { width:max-content; min-width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; }
.compare-table thead th,
.compare-table thead td { position:sticky; top:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--dv); vertical-align:top; }
.compare-table td { text-align:center; border-right:1px solid var(--dv); padding:12px 10px; font-size:0.78rem; vertical-align:middle; }




.slot-card { display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 10px; margin:8px; border-radius:14px; background:var(--g); backdrop-filter:blur(88px) saturate(2); -webkit-backdrop-filter:blur(88px) saturate(2); border:1px solid var(--gi); box-shadow:none; transition:background .25s; }
.slot-card.empty { background:rgba(128,128,128,0.05); box-shadow:none; border:1px solid var(--dv); }
.slot-img { width:80px; height:130px; object-fit:contain; border-radius:6px; }
.slot-name { font-size:11px; font-weight:400; color:var(--tx); text-align:center; line-height:1.3; }
.slot-brand { font-size:10px; color:var(--ts); margin-top:-2px; }
.slot-search { width:100%; padding:7px 10px; font-size:12px; background:var(--sl); backdrop-filter:blur(72px); -webkit-backdrop-filter:blur(72px); border:1px solid var(--dv); border-radius:7px; color:var(--tx); font-family:'Inter',sans-serif; outline:none; transition:background .2s; user-select:text; -webkit-user-select:text; }
.slot-search:focus { background:var(--gh); }
.slot-remove { font-size:11px; color:var(--ts); cursor:pointer; padding:3px 8px; border-radius:5px; border:1px solid var(--dv); background:transparent; font-family:'Inter',sans-serif; transition:background .18s; }
.slot-remove:hover { background:rgba(220,38,38,0.10); color:#dc2626; border-color:rgba(220,38,38,0.25); }
.slot-dropdown { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--dd); backdrop-filter:blur(96px) saturate(2); -webkit-backdrop-filter:blur(96px) saturate(2); border:1px solid var(--gi); z-index:300; max-height:200px; overflow-y:auto; display:none; border-radius:10px; box-shadow:none; }
.slot-item { padding:9px 12px; border-bottom:1px solid var(--dv); cursor:pointer; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--tx); }
.slot-item:hover { background:var(--g); }
.slot-item img { width:28px; height:28px; object-fit:contain; border-radius:4px; }
.diff-mode-active .row-same { display:none !important; }
.diff-word-common { color:var(--dc); }
.diff-word-unique { color:var(--du); font-weight:700; }

.similar-section { margin-top:28px; padding-top:22px; border-top:1px solid var(--dv); }
.similar-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; margin-top:14px; }
.mini-card { padding:10px; border-radius:14px; cursor:pointer; text-align:center; background:var(--g); backdrop-filter:blur(88px) saturate(2); -webkit-backdrop-filter:blur(88px) saturate(2); border:1px solid var(--gi); box-shadow:none; transition:background .18s, transform .18s; }
.mini-card:hover { transform:translateY(-3px); background:var(--gh); }
.mini-card img { width:100%; height:90px; object-fit:contain; margin-bottom:6px; }
.mini-card h4 { font-size:11.5px; font-weight:600; color:var(--tx); margin:0; }

.submit-btn { transition:background .18s, transform .18s; }

  .controls{flex-direction:column} .csel{min-width:0;width:100%}

}

  .compare-table td{width:calc((min(100vw,1200px) - 130px)/3);min-width:180px}
}

/* news */
#progressBar { position:fixed; top:0; left:0; height:2px; background:rgba(100,100,110,0.6); width:0%; z-index:2500; transition:width .2s; }
.news-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr)); gap:clamp(12px,2vw,20px); }
.news-card { cursor:pointer; overflow:hidden; display:flex; flex-direction:column; border-radius:18px; background:var(--g); backdrop-filter:blur(88px) saturate(2); -webkit-backdrop-filter:blur(88px) saturate(2); border:1px solid var(--gi); transition:transform .22s cubic-bezier(.34,1.4,.64,1),background .2s; animation:cardIn .4s ease both; }
.news-card:hover { transform:translateY(-4px) scale(1.012); background:var(--gh); }
.news-card:active { transform:scale(.98); }
.news-img { width:100%; height:200px; object-fit:cover; display:block; }
.news-body { padding:clamp(14px,2vw,22px); flex:1; display:flex; flex-direction:column; }
.news-meta { font-size:10.5px; color:var(--ts); margin-bottom:8px; display:flex; justify-content:space-between; text-transform:uppercase; letter-spacing:.06em; }
.news-title { font-size:clamp(15px,2vw,18px); font-weight:700; letter-spacing:-.3px; margin:0 0 10px; color:var(--tx); line-height:1.3; }
.news-summary { font-size:13px; color:var(--ts); line-height:1.6; flex:1; margin-bottom:14px;  }
.read-more { font-size:12.5px; font-weight:600; color:var(--ts); margin-top:auto; letter-spacing:.02em; }
.hero-card { grid-column:1/-1; flex-direction:row; height:360px; }
.hero-card .news-img { width:50%; height:100%; flex-shrink:0; }
.hero-card .news-body { width:50%; justify-content:center; padding:clamp(20px,4vw,44px); }
.hero-card .news-title { font-size:clamp(20px,3vw,30px); margin-bottom:14px; }
.hero-card .news-summary {  font-size:14px; }
@media(max-width:700px) { .hero-card { flex-direction:column; height:auto; } .hero-card .news-img { width:100%; height:220px; } .hero-card .news-body { width:100%; padding:20px; } }
#article-view { animation:fadeUp .3s ease both; }
.article-header { margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid var(--dv); }
.article-title { font-size:clamp(22px,4vw,38px); font-weight:700; letter-spacing:-.8px; line-height:1.2; margin:10px 0 16px; }
.article-meta-row { display:flex; justify-content:space-between; align-items:center; color:var(--ts); font-size:13px; flex-wrap:wrap; gap:8px; }
.reading-time-badge { background:var(--bd); padding:3px 11px; border-radius:20px; font-size:11.5px; display:flex; align-items:center; gap:4px; }
.share-btn { display:flex; align-items:center; gap:6px; cursor:pointer; padding:6px 12px; border-radius:8px; background:var(--g); backdrop-filter:blur(88px) saturate(2); -webkit-backdrop-filter:blur(88px) saturate(2); border:1px solid var(--gi); font-size:13px; font-family:"Inter",sans-serif; color:var(--ts); transition:background .18s; }
.share-btn:hover { background:var(--gh); }
.share-btn svg { width:15px; height:15px; fill:currentColor; }
.article-hero { width:100%; height:auto; max-height:480px; object-fit:cover; border-radius:16px; margin-bottom:28px; display:block; }
.article-content { font-size:clamp(15px,2vw,16.5px); line-height:1.8; color:var(--tx); max-width:780px; margin:0 auto; }
.article-content p { margin-bottom:20px; }

        <div class="csel-menu">

<script>
let allNews = [], sortVal = 'newest';

function cselToggle(id, e) {
  e.stopPropagation();
  const isOpen = document.getElementById(id).classList.contains('open');
  document.querySelectorAll('.csel.open').forEach(el=>el.classList.remove('open'));
  if(!isOpen) document.getElementById(id).classList.add('open');
}
function cselPick(val, label) {
  sortVal = val;
  document.getElementById('sortLabel').textContent = label;
  document.getElementById('sortSel').querySelector('.csel-menu').querySelectorAll('.csel-opt').forEach(o=>o.classList.toggle('selected', o.textContent.trim()===label));
  document.getElementById('sortSel').classList.remove('open');
  renderNews();
}

function fmtDate(str) {
  if(!str) return '';
  const d = new Date(str+'T00:00:00');
  if(isNaN(d)) return str;
  return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
}

async function init() {
  try {
    const res = await fetch('news.json');
    if(!res.ok) throw new Error();
    allNews = await res.json();
    if(!allNews.length) throw new Error();
  } catch(e) {
    allNews = [{
      title:'undefined',
      summary:'undefined',
      author:'undefined',
      date:'',
      image:'',
      content:'<p>undefined</p>'
    }];
  }
  renderNews();
}

function renderNews() {
  const term = document.getElementById('searchInput').value.toLowerCase();
  let list = allNews.filter(n => n.title.toLowerCase().includes(term) || (n.summary||'').toLowerCase().includes(term));
  list.sort((a,b) => {
    const da = new Date(a.date).getTime();
    const db = new Date(b.date).getTime();
    return sortVal==='newest' ? db-da : da-db;
  });
  const grid = document.getElementById('newsGrid');
  if(!list.length){grid.innerHTML="<p style='color:var(--text-soft);padding:40px;grid-column:1/-1;text-align:center;'>No articles found.</p>";return;}
  grid.innerHTML = list.map((n,idx) => {
    const isHero = idx===0 && term==='';
    const cls = isHero ? 'news-card hero-card' : 'news-card';
    const imgHtml = n.image ? `<img src="${n.image}" class="news-img" onerror="this.style.display='none'" loading="lazy"/>` : '';
    return `<div class="${cls}" onclick="openArticle('${n.title.replace(/'/g,"\\'")}')">
      ${imgHtml}
      <div class="news-body">
        <div class="news-meta"><span>${fmtDate(n.date)}</span><span>${n.author||''}</span></div>
        <h2 class="news-title">${n.title}</h2>
        <div class="news-summary">${n.summary||''}</div>
        <div class="read-more">Read Article →</div>
      </div>
    </div>`;
  }).join('');
}

function openArticle(title) {
  const article = allNews.find(n=>n.title===title);
  if(!article) return;
  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('article-view').classList.remove('hidden');
  window.scrollTo(0,0);
  document.getElementById('a_title').textContent = article.title;
  document.getElementById('a_date').textContent = fmtDate(article.date);
  document.getElementById('a_author').textContent = 'By '+(article.author||'');
  const img = document.getElementById('a_img');
  if(article.image){img.src=article.image;img.style.display='block';}else{img.style.display='none';}
  document.getElementById('a_content').innerHTML = article.content||'';
  const words = (article.content||'').replace(/<[^>]*>/g,'').split(/\s+/).length;
  document.getElementById('a_time').textContent = `⏱ ${Math.max(1,Math.ceil(words/200))} min read`;
}

function closeArticle() {
  document.getElementById('article-view').classList.add('hidden');
  document.getElementById('list-view').classList.remove('hidden');
  window.scrollTo(0,0);
}

function shareArticle() {
  navigator.clipboard.writeText(window.location.href);
  alert('Link copied: '+document.getElementById('a_title').textContent);
}

window.onscroll = () => {
  const scrolled = (document.body.scrollTop||document.documentElement.scrollTop) / (document.documentElement.scrollHeight-document.documentElement.clientHeight) * 100;
  document.getElementById('progressBar').style.width = scrolled+'%';
};


let _labelTimer;

function _updateSidebarBlur() {
  const wrapper = document.querySelector('.compare-wrapper');
  const table = document.getElementById('compareTable');
  if (!wrapper || !table) return;
  let bl = document.getElementById('_sb_blur');
  if (!bl) {
    bl = document.createElement('div');
    bl.id = '_sb_blur';
    bl.style.cssText = 'position:fixed;z-index:49;pointer-events:none;backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);transition:opacity 0.25s;opacity:0';
    document.body.appendChild(bl);
  }
  const r = wrapper.getBoundingClientRect();
  const visible = r.top < window.innerHeight && r.bottom > 0;
  if (visible && table.classList.contains('labels-visible')) {
    bl.style.left = r.left + 'px';
    bl.style.top = Math.max(r.top, 60) + 'px';
    bl.style.width = '130px';
    bl.style.height = (Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 60)) + 'px';
    bl.style.opacity = '1';
  } else {
    bl.style.opacity = '0';
  }
}
function _showLabels(){const t=document.getElementById('compareTable');if(!t)return;t.classList.add('labels-visible');clearTimeout(_labelTimer);_updateSidebarBlur();_labelTimer=setTimeout(()=>t.classList.remove('labels-visible'),1600);}
function _attachCompareFade(){const w=document.querySelector('.compare-wrapper');if(!w||w._fadeAttached)return;w._fadeAttached=true;['scroll','mousemove','touchmove','touchstart','mouseenter'].forEach(ev=>w.addEventListener(ev,_showLabels,{passive:true}));window.addEventListener('scroll',_updateSidebarBlur,{passive:true});window.addEventListener('resize',_updateSidebarBlur,{passive:true});}

document.getElementById('themeBtn').addEventListener('click',()=>{
  const html=document.documentElement;
  const isDark=html.dataset.theme==='dark';
  const btn=document.getElementById('themeBtn');
  const wrap=document.getElementById('iconWrap');
  btn.classList.remove('rippling');void btn.offsetWidth;btn.classList.add('rippling');
  wrap.classList.remove('spin');void wrap.offsetWidth;wrap.classList.add('spin');
  setTimeout(()=>{html.dataset.theme=isDark?'light':'dark';localStorage.setItem('ch-theme',html.dataset.theme);},230);
  setTimeout(()=>{wrap.classList.remove('spin');btn.classList.remove('rippling');},650);
});
document.getElementById('socialsBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('socialsDropdown').classList.toggle('open');});
document.getElementById('mobileSocialsBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('mobileSocialsDropdown').classList.toggle('open');});
document.getElementById('hamburger').addEventListener('click',()=>{document.getElementById('hamburger').classList.toggle('open');document.getElementById('mobileNav').classList.toggle('open');});
document.addEventListener('click',e=>{
  if(!e.target.closest('.dropdown-wrap')){document.getElementById('socialsDropdown').classList.remove('open');document.getElementById('mobileSocialsDropdown').classList.remove('open');}
  if(!e.target.closest('.csel')) document.querySelectorAll('.csel.open').forEach(el=>el.classList.remove('open'));
});
document.getElementById('searchInput').addEventListener('input',renderNews);

init();
</script>
</body>
